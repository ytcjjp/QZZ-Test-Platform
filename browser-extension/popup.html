<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QZZ 飞书导入</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
  <div class="brand">QZZ <span>飞书文档导入</span></div>
  <p class="intro">安装在平台服务器这台电脑的 Chrome 中，并先在此 Chrome 登录飞书。</p>
  <div class="status" role="status" aria-live="polite"><i id="indicator"></i><span id="status">正在检查连接…</span></div>
  <form id="pair-form">
    <label for="port">平台端口</label><input id="port" type="number" min="1" max="65535" value="3210" required>
    <label for="code">一次性配对码</label><input id="code" placeholder="平台生成的 12 位配对码" maxlength="12" autocomplete="off" spellcheck="false" required>
    <button id="pair" type="submit">配对并连接</button>
  </form>
  <div class="actions"><button id="reconnect" type="button">重新连接</button><button id="disconnect" type="button">断开连接</button></div>
  <p id="error" role="alert" hidden></p>
  <p class="footnote">配对后，在 QZZ 平台粘贴飞书文档地址即可导入。读取会打开并自动关闭后台标签页。未读完整的内容会在平台明确提示。</p>
</main><script type="module" src="popup.js"></script></body></html>
